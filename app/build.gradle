plugins { id 'com.android.application' }

android {
    namespace 'com.dantheman827.mainredirect'
    compileSdk 29
    defaultConfig {
        applicationId 'com.dantheman827.mainredirect'
        minSdk 27
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies { compileOnly 'de.robv.android.xposed:api:82' }

tasks.register('validateReplacement') {
    doLast {
        def payloads = fileTree('src/main/assets/replacements') { include '*/libmain.so' }
        if (payloads.isEmpty()) {
            throw new GradleException('Add assets/replacements/<abi>/libmain.so; see README.md')
        }
        def abis = ['arm64-v8a': [2,183], 'armeabi-v7a': [1,40], 'x86': [1,3], 'x86_64': [2,62]]
        payloads.each { file ->
            def expected = abis[file.parentFile.name]
            def header = new byte[20]
            file.withInputStream { input ->
                if (input.read(header) != header.length) {
                    throw new GradleException("Truncated ELF: ${file}")
                }
            }
            def machine = (header[18] & 255) | ((header[19] & 255) << 8)
            if (expected == null || header[0] != 127 || header[1] != 69 ||
                header[2] != 76 || header[3] != 70 || header[5] != 1 ||
                header[4] != expected[0] || machine != expected[1]) {
                throw new GradleException("ELF architecture does not match folder: ${file}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'validateReplacement' }
